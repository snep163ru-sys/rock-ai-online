<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta property="og:title" content="NEURA ROCK">
<meta property="og:description" content="ИИ-радио рок-музыки — 12 жанров от нейросетей">
<meta property="og:image" content="https://rock-ai.online/vk-app/icon.jpg">
<meta property="og:url" content="https://rock-ai.online/vk-app/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEURA ROCK</title>
<link rel="icon" type="image/jpeg" href="icon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Oswald:wght@500;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #030305;
  --card-bg: rgba(10, 10, 16, 0.95);
  --accent-color: #00ffcc;
  --text-color: #ffffff;
  --text-muted: #5f5f7a;
  --glow-color: rgba(0, 255, 204, 0.25);

body.vk_dark {
  --bg-color: #030305;
  --card-bg: rgba(10, 10, 16, 0.95);
}

}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Roboto', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  min-height: 100vh;
  background-image: radial-gradient(circle at center, #090914 0%, #030305 100%);
  padding: 12px 12px 80px;
  margin: 0;
}

.logo-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 0 0 10px var(--glow-color);
  padding: 16px 4px 4px;
}

/* genres scroll */
.genres-wrap {
  margin: 12px 0;
  background: rgba(0, 0, 0, 0.3);
  padding: 6px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.02);
}
.genres {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.genres::-webkit-scrollbar { display: none; }
.genre-btn {
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: #8c8ca3;
  padding: 8px 12px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 10px;
  letter-spacing: 0.5px;
  transition: all 0.3s;
  white-space: nowrap;
}
.genre-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
.genre-btn.active {
  background: var(--accent-color);
  color: #000;
  border-color: var(--accent-color);
  box-shadow: 0 0 12px var(--glow-color);
}

/* player card */
.player-card {
  background-color: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 28px;
  padding: 24px 20px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.9), 0 0 40px var(--glow-color);
  position: relative;
  text-align: center;
  margin-bottom: 16px;
}
.player-card::before {
  content: '';
  position: absolute;
  top: 0; left: 15%; width: 70%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
  box-shadow: 0 0 10px var(--accent-color);
}

/* sphere visualization */
.sphere-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}
.visualizer-sphere {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 2px dashed var(--accent-color);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px var(--glow-color);
  position: relative;
  transition: all 0.3s;
}
.visualizer-sphere.playing {
  animation: pulse-sphere 1.5s infinite alternate, rotate-sphere 25s linear infinite;
}
@keyframes pulse-sphere {
  0% { transform: scale(1); box-shadow: 0 0 15px var(--glow-color); }
  100% { transform: scale(1.05); box-shadow: 0 0 35px var(--glow-color); }
}
@keyframes rotate-sphere {
  100% { transform: rotate(360deg); }
}
.neural-node {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  border: 2px solid var(--accent-color);
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  background-image: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
  overflow: hidden;
}
.neural-node svg {
  width: 45px;
  height: 45px;
  filter: drop-shadow(0 0 8px var(--accent-color));
  z-index: 2;
  color: var(--accent-color);
}
.neural-node::after {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
  z-index: 3;
}

/* track info */
.track-info { margin-bottom: 20px; }
.track-title {
  font-family: 'Oswald', sans-serif;
  font-size: 1.3rem;
  text-transform: uppercase;
  margin-bottom: 2px;
  letter-spacing: 0.5px;
}
.track-artist {
  font-size: 0.8rem;
  color: var(--text-muted);
}

/* progress */
.progress-wrap { margin-bottom: 20px; }
.progress-track {
  height: 3px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent-color);
  box-shadow: 0 0 6px var(--accent-color);
  transition: width 0.2s linear;
  border-radius: 2px;
}
.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 4px;
  font-family: 'Orbitron', sans-serif;
}

/* controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}
.ctrl-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-color);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.ctrl-btn:hover { color: var(--accent-color); border-color: var(--accent-color); box-shadow: 0 0 10px var(--glow-color); }
.ctrl-btn.play-btn {
  width: 56px;
  height: 56px;
  background: var(--accent-color);
  color: #000;
  font-size: 24px;
  line-height: 1;
  box-shadow: 0 0 20px var(--glow-color);
  border: 2px solid var(--accent-color);
}
.ctrl-btn.play-btn:hover {
  background: var(--accent-color);
  color: #000;
  border-color: var(--accent-color);
}
.ctrl-btn.play-btn.playing {
  background: var(--accent-color);
  border-color: var(--accent-color);
}
.ctrl-btn.play-btn .icon-play {
  display: block;
  width: 0;
  height: 0;
  border-left: 14px solid #000;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
}
.ctrl-btn.play-btn .icon-pause {
  display: none;
  width: 16px;
  height: 16px;
  border-left: 6px solid #000;
  border-right: 6px solid #000;
}
.ctrl-btn.play-btn.playing .icon-play { display: none; }
.ctrl-btn.play-btn.playing .icon-pause { display: block; }

.ctrl-btn.play-btn:hover { background: #00ffcc; }

/* track list */
.track-list-wrap {
  background-color: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 20px;
  padding: 16px;
}
.list-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
}
.tl-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 8px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  border-bottom: 1px solid rgba(255, 255, 255, 0.02);
}
.tl-item:last-child { border-bottom: none; }
.tl-item:hover { background: rgba(255, 255, 255, 0.03); }
.tl-item.active { background: rgba(0, 255, 204, 0.08); border-left: 2px solid var(--accent-color); padding-left: 6px; }
.tl-num {
  width: 20px;
  font-size: 0.7rem;
  color: var(--text-muted);
  font-family: 'Orbitron', sans-serif;
  flex-shrink: 0;
}
.tl-info { flex: 1; min-width: 0; }
.tl-title {
  font-family: 'Oswald', sans-serif;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tl-genre {
  font-size: 0.65rem;
  color: var(--text-muted);
  font-family: 'Orbitron', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tl-active-indicator { color: var(--accent-color); font-size: 0.7rem; font-family: 'Orbitron', sans-serif; flex-shrink: 0; }

/* status */
.status-bar {
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-muted);
  padding: 12px 0 0;
  font-family: 'Orbitron', sans-serif;
}
.spin {
  display: inline-block;
  width: 10px; height: 10px;
  border: 2px solid var(--accent-color);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="logo-text">NEURA ROCK</div>

<div class="genres-wrap">
  <div class="genres" id="genres"></div>
</div>

<div class="player-card">
  <div class="sphere-wrap">
    <div class="visualizer-sphere" id="sphere">
      <div class="neural-node" id="sphereIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
    </div>
  </div>

  <div class="track-info">
    <div class="track-title" id="trackTitle">ВЫБЕРИ ЖАНР</div>
    <div class="track-artist" id="trackMeta">NEURA ROCK</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="time-row">
      <span id="timeCur">0:00</span>
      <span id="timeTotal">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnPrev">◀◀</button>
    <button class="ctrl-btn play-btn" id="btnPlay"><span class="icon-play"></span><span class="icon-pause"></span></button>
    <button class="ctrl-btn" id="btnNext">▶▶</button>
  </div>
</div>

<div class="track-list-wrap">
  <div class="list-title">Плейлист</div>
  <div id="trackList"></div>
</div>

<div class="status-bar" id="status">ЗАГРУЗКА…</div>

<script src="vk-bridge.min.js"></script>
<script>
const GENRES = [
  { key: 'cyberpunk', name: 'CYBERPUNK', color: '#00ffcc' },
  { key: 'industrial', name: 'INDUSTRIAL', color: '#ff5500' },
  { key: 'grunge', name: 'GRUNGE', color: '#b026ff' },
  { key: 'psychedelic', name: 'PSYCHEDELIC', color: '#ff00aa' },
  { key: 'progressive', name: 'PROGRESSIVE', color: '#00aaff' },
  { key: 'punk', name: 'PUNK ROCK', color: '#ff3333' },
  { key: 'alternative', name: 'ALTERNATIVE', color: '#ffff00' },
  { key: 'heavy', name: 'HEAVY METAL', color: '#ff0055' },
  { key: 'power', name: 'POWER METAL', color: '#33ff33' },
  { key: 'numetal', name: 'NU METAL', color: '#e600ff' },
  { key: 'folk', name: 'FOLK ROCK', color: '#00ff66' },
  { key: 'glam', name: 'GLAM ROCK', color: '#ff8800' }
];

let vkBridge = null;
let currentGenre = null;
let playlist = [];
let currentIndex = 0;
const audio = new Audio();
const api = 'https://rock-ai.online/admin/api.php?genre=';

if (window.vkBridge) {
  vkBridge = window.vkBridge;
  // показываем VK, что приложение готово
  vkBridge.send('VKWebAppInit').then((data) => {
    console.log('VKWebAppInit success', data);
  }).catch((e) => {
    console.error('VKWebAppInit error', e);
  });
  vkBridge.subscribe((event) => {
    if (event.detail.type === 'VKWebAppUpdateConfig') {
      const data = event.detail.data || {};
      const scheme = data.scheme || data.appearance || 'light';
      if (scheme === 'dark' || scheme === 'space_gray') {
        document.body.classList.add('vk_dark');
      } else {
        document.body.classList.remove('vk_dark');
      }
    }
  });
} else {
  console.error('vk-bridge не загружен');
}

const genresEl = document.getElementById('genres');
GENRES.forEach(g => {
  const btn = document.createElement('button');
  btn.className = 'genre-btn';
  btn.textContent = g.name;
  btn.addEventListener('click', () => selectGenre(g.key));
  genresEl.appendChild(btn);
});

async function selectGenre(key) {
  currentGenre = key;
  document.querySelectorAll('.genre-btn').forEach((b, i) => b.classList.toggle('active', GENRES[i].key === key));
  setStatus('ЗАГРУЗКА ТРЕКОВ…', true);
  try {
    const res = await fetch(api + encodeURIComponent(key));
    const data = await res.json();
    playlist = Array.isArray(data) ? data : [];
    if (playlist.length === 0) {
      setStatus('В ЖАНРЕ НЕТ ТРЕКОВ');
      document.getElementById('trackTitle').textContent = 'ЖАНР ПУСТ';
      document.getElementById('trackList').innerHTML = '';
      document.getElementById('sphere').classList.remove('playing');
      return;
    }
    currentIndex = 0;
    renderTrackList();
    playTrack(0);
    setStatus('');
  } catch (e) {
    setStatus('ОШИБКА: ' + e.message);
  }
}

function renderTrackList() {
  const list = document.getElementById('trackList');
  list.innerHTML = '';
  playlist.forEach((t, i) => {
    const name = t.title || t.url.split('/').pop().replace('.mp3', '').replace(/_/g, ' ');
    const item = document.createElement('div');
    item.className = 'tl-item' + (i === currentIndex ? ' active' : '');
    item.innerHTML =
      '<div class="tl-num">' + (i + 1).toString().padStart(2, '0') + '</div>' +
      '<div class="tl-info"><div class="tl-title">' + esc(name) + '</div>' +
      '<div class="tl-genre">' + esc(GENRES.find(x => x.key === currentGenre)?.name || currentGenre) + '</div></div>' +
      (i === currentIndex ? '<div class="tl-active-indicator">▶</div>' : '<div class="tl-active-indicator"></div>');
    item.addEventListener('click', () => playTrack(i));
    list.appendChild(item);
  });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function setStatus(text, spin) {
  document.getElementById('status').innerHTML = spin ? '<span class="spin"></span>' + esc(text) : esc(text);
}

function playTrack(index) {
  if (!playlist.length) return;
  currentIndex = index;
  const track = playlist[currentIndex];
  audio.src = 'https://rock-ai.online' + track.url;
  const name = track.title || track.url.split('/').pop().replace('.mp3', '').replace(/_/g, ' ');
  document.getElementById('trackTitle').textContent = name.toUpperCase();
  document.getElementById('trackMeta').textContent = (track.artist || GENRES.find(x => x.key === currentGenre)?.name || currentGenre).toUpperCase() + ' · NEURA ROCK';
  document.getElementById('btnPlay').classList.add('playing');
  document.getElementById('sphere').classList.add('playing');
  document.querySelectorAll('.tl-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIndex);
    el.querySelector('.tl-active-indicator').textContent = i === currentIndex ? '▶' : '';
  });
  audio.play().catch(() => {});
}

audio.addEventListener('ended', () => nextTrack());
audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => {
  document.getElementById('timeTotal').textContent = fmt(audio.duration);
  updateProgress();
});

function updateProgress() {
  if (!audio.duration) return;
  document.getElementById('progressBar').style.width = (audio.currentTime / audio.duration * 100) + '%';
  document.getElementById('timeCur').textContent = fmt(audio.currentTime);
}

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function togglePlay() {
  if (!audio.src) { if (currentGenre) selectGenre(currentGenre); return; }
  const btn = document.getElementById('btnPlay');
  if (audio.paused) {
    audio.play();
    btn.classList.add('playing');
    document.getElementById('sphere').classList.add('playing');
  } else {
    audio.pause();
    btn.classList.remove('playing');
    document.getElementById('sphere').classList.remove('playing');
  }
}
function nextTrack() {
  if (!playlist.length) return;
  playTrack((currentIndex + 1) % playlist.length);
}
function prevTrack() {
  if (!playlist.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  playTrack((currentIndex - 1 + playlist.length) % playlist.length);
}

// Click on progress bar to seek
document.getElementById('progressTrack').addEventListener('click', function(e) {
  if (!audio.duration) return;
  const rect = this.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

document.getElementById('btnPlay').addEventListener('click', togglePlay);
document.getElementById('btnNext').addEventListener('click', nextTrack);
document.getElementById('btnPrev').addEventListener('click', prevTrack);

// Support genre selection via URL param for screenshots
const urlGenre = new URLSearchParams(window.location.search).get('genre');
selectGenre(urlGenre || 'cyberpunk');



// VK Mini Apps rule 2.2.5: stop audio when app is hidden/backgrounded
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !audio.paused) {
    audio.pause();
    const btn = document.getElementById('btnPlay');
    if (btn) { btn.classList.remove('playing'); }
    const sphere = document.getElementById('sphere');
    if (sphere) { sphere.classList.remove('playing'); }
  }
});
</script>
</body>
</html>
