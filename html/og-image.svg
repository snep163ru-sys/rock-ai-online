<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Фон -->
  <rect width="1200" height="630" fill="#0a0a10"/>
  
  <!-- Рамка -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.3"/>
  <rect x="40" y="40" width="1120" height="550" rx="15" fill="none" stroke="#00ffcc" stroke-width="1" opacity="0.2"/>
  
  <!-- Логотип (круг) -->
  <circle cx="250" cy="315" r="150" fill="none" stroke="#00ffcc" stroke-width="3" opacity="0.5"/>
  <circle cx="250" cy="315" r="120" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.7"/>
  <circle cx="250" cy="315" r="30" fill="#00ffcc"/>
  
  <!-- Текст -->
  <text x="460" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00ffcc">NEURA ROCK</text>
  <text x="460" y="350" font-family="Arial, sans-serif" font-size="32" fill="#5f5f7a">ИИ РОК-РАДИО</text>
  <text x="460" y="400" font-family="Arial, sans-serif" font-size="20" fill="#5f5f7a" opacity="0.7">🎸 12 жанров • Бесконечный эфир</text>
  
  <!-- Неоновые линии -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#00ffcc" stroke-width="1" opacity="0.1"/>
  <line x1="100" y1="560" x2="1100" y2="560" stroke="#00ffcc" stroke-width="1" opacity="0.1"/>
</svg>
